name: test

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/debug.yml'
  pull_request:

jobs:
  build:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.0
      - name: Build
        run: |
          make test
          go test -c -o ping_test ./ping
          sudo ./ping_test -test.v
      - name: Exclusive TUN creation regression
        run: |
          go test -race -c -o "$RUNNER_TEMP/tun.test" .
          sudo unshare --net -- env SING_TUN_SYSTEM_TEST=1 "$RUNNER_TEMP/tun.test" -test.run '^TestExclusiveTunCreation$' -test.v -test.timeout 30s
  build_go124:
    name: Linux (Go 1.24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.24
        continue-on-error: true
      - name: Build
        run: |
          make test
          go test -c -o ping_test ./ping
          sudo ./ping_test -test.v
  build_go123:
    name: Linux (Go 1.23)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.23
        continue-on-error: true
      - name: Build
        run: |
          make test
          go test -c -o ping_test ./ping
          sudo ./ping_test -test.v
  build_windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.23
        continue-on-error: true
      - name: Build
        run: |
          make test
          go test -v ./ping
  windows_regression:
    name: Windows creation regressions (Go 1.27.3)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: PE loader bounds and adapter errors under race/checkptr
        run: go test -race -count=1 ./internal/wintun ./internal/wintun/memmod
      - name: Session failure, default reuse and exclusive creation
        env:
          SING_TUN_SYSTEM_TEST: '1'
        run: go test -race -count=1 -timeout 3m -run '^Test(StartWintunSession|ExclusiveWintunCreation|WintunDefaultReuse)$' -v .
  build_darwin:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.23
        continue-on-error: true
      - name: Build
        run: |
          make test
          go test -v ./ping
          go test -c -o ping_test ./ping
          sudo ./ping_test -test.v
