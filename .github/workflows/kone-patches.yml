name: KONE compatibility fixes

on:
  pull_request:
    branches: [codex/kone-stable-base]

permissions:
  contents: read

concurrency:
  group: patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Regressions (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.25.x', '1.27.3']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Vet
        run: go vet .
      - name: Windows PE loader bounds under race/checkptr
        if: runner.os == 'Windows'
        run: go test -race -count=1 ./internal/wintun ./internal/wintun/memmod
      - name: Windows session failure and real exclusive adapter creation
        if: runner.os == 'Windows'
        env:
          SING_TUN_SYSTEM_TEST: '1'
        run: go test -race -count=1 -timeout 3m -run '^Test(StartWintunSession|ExclusiveWintunCreation)$' -v .
      - name: Build Linux regression with race
        if: runner.os == 'Linux'
        run: go test -race -c -o "$RUNNER_TEMP/tun.test" .
      - name: Linux persistent interface ownership in isolated namespace
        if: runner.os == 'Linux'
        run: sudo unshare --net -- env SING_TUN_SYSTEM_TEST=1 "$RUNNER_TEMP/tun.test" -test.run '^TestExclusiveTunCreation$' -test.v -test.timeout 30s
